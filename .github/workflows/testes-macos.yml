name: TeleZapp para Mac

# Testes automaticos, teste de fumaca (abre o programa de verdade) e o
# TeleZapp.app para o Mac, em Apple Silicon e Intel. O .app sai como artefato
# da execucao (aba Actions > a execucao > Artifacts). Nao publica nada.
# A experiencia com o VoiceOver, o audio e as chamadas so quem tem um Mac vê.
on:
  workflow_dispatch:
  push:
    branches: [mac, experimento-macos]

permissions:
  contents: read

jobs:
  mac:
    name: macOS ${{ matrix.rotulo }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - rotulo: Apple Silicon
            runner: macos-latest
            arq: apple-silicon
          - rotulo: Intel
            runner: macos-15-intel
            arq: intel
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Biblioteca do sistema que o neonize pede (libmagic)
        run: brew install libmagic
      - name: Instalar as dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyinstaller pillow
      - name: Testes automaticos
        run: python -m pytest testes -q -p no:cacheprovider --tb=short -rfE 2>&1 | tail -120
      - name: Teste de fumaca (abre o TeleZapp pelo codigo)
        run: python ferramentas/fumaca_mac.py --saida saida/fumaca-codigo --espera 14
      - name: Icone
        run: |
          mkdir -p build-mac
          python -c "from PIL import Image; Image.open('telezapp/imagens/telezapp.png').convert('RGBA').resize((1024,1024)).save('build-mac/telezapp.icns')"
      - name: Empacotar o TeleZapp.app
        run: |
          export TELEZAPP_VERSAO=$(python -c "import telezapp;print(telezapp.VERSAO)")
          pyinstaller --noconfirm --distpath build-mac/dist --workpath build-mac/work ferramentas/empacotar/TeleZapp-mac.spec
          ls build-mac/dist
          codesign --verify --deep --strict build-mac/dist/TeleZapp.app || true
          codesign -dv build-mac/dist/TeleZapp.app 2>&1 | head -5 || true
          ditto -c -k --sequesterRsrc --keepParent build-mac/dist/TeleZapp.app TeleZapp-mac-${{ matrix.arq }}.zip
          ls -la TeleZapp-mac-${{ matrix.arq }}.zip
      - name: Teste de fumaca do TeleZapp.app (abre o pacote de verdade)
        run: |
          mkdir -p saida/fumaca-app
          export TELEZAPP_DADOS="$RUNNER_TEMP/dados-do-app"
          build-mac/dist/TeleZapp.app/Contents/MacOS/TeleZapp > saida/fumaca-app/stdout.txt 2>&1 &
          PID=$!
          sleep 20
          screencapture -x saida/fumaca-app/janela.png || true
          if kill -0 $PID 2>/dev/null; then echo "o app continua aberto: ok" | tee saida/fumaca-app/resultado.txt; else echo "O APP FECHOU SOZINHO" | tee saida/fumaca-app/resultado.txt; fi
          kill $PID 2>/dev/null || true
          sleep 2
          cp -R "$TELEZAPP_DADOS/logs" saida/fumaca-app/logs 2>/dev/null || true
          grep -c "janela mostrada" "$TELEZAPP_DADOS/logs/telezapp.log" 2>/dev/null | sed 's/^/vezes que a janela foi mostrada: /' | tee -a saida/fumaca-app/resultado.txt || true
      - name: Guardar o TeleZapp.app e os resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TeleZapp-mac-${{ matrix.arq }}
          path: |
            TeleZapp-mac-${{ matrix.arq }}.zip
            saida/
          if-no-files-found: warn
          retention-days: 30
