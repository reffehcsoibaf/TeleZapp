name = "telezapp"
main = "worker.js"
compatibility_date = "2026-10-01"
preview_urls = false

# Troque o id pelo que `npx wrangler kv namespace create RELATOS` mostrar.
[[kv_namespaces]]
binding = "RELATOS"
id = "fa213f960cc446d3ad355d8941e88e8d"

[vars]
# Endereço do próprio Worker, usado no aviso opcional pelo Telegram.
ENDERECO_ADMIN = "https://telezapp.fabioscheffer.workers.dev"

# A página do projeto (a mesma pasta site/ que vai para o GitHub Pages) sai
# também por este Worker, na raiz. O que não é arquivo da pasta (/relato,
# /uso e /admin) continua indo para o worker.js.
[assets]
directory = "../site"
